[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adduce"
version = "0.1.2"
description = "A local research-artifact auditor: checks that a paper's claims, code, configs, data, and results still agree, and produces the artifacts reviewers ask for."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Harshil Chudasama", email = "chudasama.h@northeastern.edu" },
]
keywords = [
    "reproducibility",
    "research",
    "machine-learning",
    "artifact-evaluation",
    "static-analysis",
    "provenance",
    "auditing",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "libcst>=1.1",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "jsonschema>=4.23,<5",
    "types-PyYAML",
]
release = [
    "build>=1.2",
    "twine>=5.1",
]

[project.scripts]
adduce = "adduce.cli:app"
adduce-rng-audit = "adduce.dynamic.import_hook:main"

[project.entry-points."adduce.rules"]
builtin = "adduce.rules.builtin"

[project.urls]
Homepage = "https://github.com/QHarshil/adduce"
Repository = "https://github.com/QHarshil/adduce"
Issues = "https://github.com/QHarshil/adduce/issues"
Changelog = "https://github.com/QHarshil/adduce/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/adduce"]

[tool.hatch.build.targets.sdist]
include = [
    "src/adduce",
    "tests",
    "corpus/scripts",
    "corpus/synthetic",
    "corpus/review",
    "corpus/*.json",
    "corpus/*.md",
    "corpus/*.csv",
    "docs",
    "scripts",
    "bench",
    ".github/workflows/release.yml",
    "action.yml",
    # Anchored: a bare "README.md" is gitignore-style and therefore matches at
    # any depth, which silently shipped nested READMEs whose relative links
    # pointed at files the archive did not carry.
    "/README.md",
    "CONTRIBUTING.md",
    "SECURITY.md",
    "CITATION.cff",
    "LICENSE",
    "CHANGELOG.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
# The dev-set pairs tree holds fetched third-party clones. It is gitignored, so
# it is absent in CI, but mypy does not consult .gitignore and would otherwise
# type-check somebody else's repository on any machine that has fetched one.
exclude = "^bench/dev/pairs/"
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
disallow_untyped_defs = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "adduce.cache",
    "adduce.engine",
    "adduce.evidence",
    "adduce.evidence.remote",
    "adduce.dynamic.reproduce",
    "adduce.dynamic.resolve",
    "adduce.manifest",
    "adduce.model",
    "adduce.report",
    "adduce.report.*",
    "adduce.rules.base",
    "adduce.rules.registry",
    "adduce.telemetry",
]
disallow_untyped_defs = true
