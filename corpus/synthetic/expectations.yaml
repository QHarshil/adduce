# Positive-control expectations for the synthetic corpus.
#
# Each case isolates one behaviour. `expect` maps rule id -> status that MUST
# be observed; `forbid` maps rule id -> status that MUST NOT be observed.
# tests/test_synthetic_corpus.py enforces both on every run. These are targeted
# regression controls, not a real-world false-positive estimate. Tune fixtures,
# not expectations, unless the intended detector behaviour genuinely changed.

- case: synthetic_lr_drift
  expect:
    R-DRIFT-001: fail
  forbid:
    R-DRIFT-001: pass

- case: synthetic_lr_agreement
  expect:
    R-DRIFT-001: pass
  forbid:
    R-DRIFT-001: fail

- case: synthetic_rounding_match
  expect:
    R-RES-001: pass
    R-RES-002: pass
  forbid:
    R-RES-002: partial

- case: synthetic_material_mismatch
  expect:
    R-RES-002: partial
  forbid:
    R-RES-002: pass

- case: synthetic_seed_count
  # "averaged over 3 seeds" is a count, not a seed value; it must not drift
  # against the config's seed: 42.
  expect:
    R-DRIFT-001: not-applicable
    R-RES-003: pass
  forbid:
    R-DRIFT-001: fail

- case: synthetic_hydra_authority
  # The manifest-linked materialised Hydra config (lr 0.0001, matching the
  # paper) outranks the stale checked-in config (lr 0.001).
  expect:
    R-DRIFT-001: pass
    R-RUN-002: partial
  forbid:
    R-DRIFT-001: fail
    R-RUN-002: pass

- case: synthetic_secret
  expect:
    R-PORT-004: fail
  forbid:
    R-PORT-004: pass

- case: synthetic_tf32
  # Precision rules warn about undocumented policy; they never fail.
  expect:
    R-PREC-001: partial
  forbid:
    R-PREC-001: fail

- case: synthetic_ghost_dep
  # Two ghosts (cv2, yaml) with numpy declared: the tool reports partial
  # (fail is reserved for more than two ghosts). Pinned to observed behaviour.
  expect:
    R-DEP-010: partial
  forbid:
    R-DEP-010: pass

- case: synthetic_unpinned_remote
  expect:
    R-REMOTE-001: fail
  forbid:
    R-REMOTE-001: pass

- case: synthetic_docker_claim
  # "Run with Docker" in README prose is a claim, not evidence.
  expect:
    R-ENV-003: fail
  forbid:
    R-ENV-003: pass

- case: synthetic_seeds_claimed_not_set
  expect:
    R-DET-001: fail
    # Paper prose is a claim to be corroborated, not evidence: "5 random
    # seeds" in the .tex with no code-side seed sweep must draft as partial.
    R-RES-003: partial
  forbid:
    R-DET-001: pass
    R-RES-003: pass

- case: synthetic_metric_unrelated_table
  # The only 92.4 belongs to other methods in a related-work table and the
  # repo logs nothing; no reconciliation rule may claim success.
  expect:
    R-RES-004: not-applicable
  forbid:
    R-RES-001: pass
    R-RES-002: pass
    R-RES-003: pass
    R-RES-004: pass

- case: synthetic_untied_config
  expect:
    R-DRIFT-001: not-applicable
  forbid:
    R-DRIFT-001: fail

- case: synthetic_wrapped_table_header
  # This fixture's real assertion is not here. Its metric is named only inside a
  # \multicolumn wrapping a \rotatebox, and table cells reach the claims package
  # alone -- no rule reads them -- while run_check() below is called without a
  # paper, so the LaTeX collector never runs for it. What this file can pin is
  # that a paper the harness cannot read yields no verdict rather than a wrong
  # one. The dissolving itself is asserted by the --paper byte-identity
  # comparison and by tests/test_collectors_new.py; see the case README.
  expect:
    R-RES-001: not-applicable
  forbid:
    R-RES-001: pass
    R-RES-002: pass
    R-DRIFT-001: fail

- case: synthetic_caption_named_metric
  # Same shape as synthetic_wrapped_table_header, and the same caveat: the real
  # assertion is not here. This case's columns are named by a caption and by a
  # second header row, both of which only reach the claims package, which no rule
  # reads -- and run_check() below is called without a paper, so the LaTeX
  # collector never runs for it. What this file pins is that a paper the harness
  # cannot read yields no verdict rather than a wrong one. The naming itself is
  # asserted by the --paper byte-identity comparison, which this case is what
  # makes non-vacuous, and by tests/test_claims_extraction.py; see the README.
  expect:
    R-RES-001: not-applicable
  forbid:
    R-RES-001: pass
    R-RES-002: pass
    R-DRIFT-001: fail

- case: synthetic_macro_row_separator
  # Same shape as the two cases above, and the same caveat: the real assertion is
  # not here. This case's rows are ended by a command the paper defines and its
  # row label is written as another, both of which only reach the claims package,
  # which no rule reads -- and run_check() below is called without a paper, so the
  # LaTeX collector never runs for it. What this file pins is that a paper the
  # harness cannot read yields no verdict rather than a wrong one. The expansion
  # itself is asserted by the --paper byte-identity comparison, which this case is
  # what makes non-vacuous, and by tests/test_collectors_new.py; see the README.
  expect:
    R-RES-001: not-applicable
  forbid:
    R-RES-001: pass
    R-RES-002: pass
    R-DRIFT-001: fail

- case: synthetic_mixed_header_row
  # Same shape as the three cases above, and the same caveat: the real assertion is
  # not here. This case heads one column with a metric and the rest with dataset
  # names whose metric sits in a second header row, and that composition only
  # reaches the claims package, which no rule reads -- and run_check() below is
  # called without a paper, so the LaTeX collector never runs for it. What this
  # file pins is that a paper the harness cannot read yields no verdict rather than
  # a wrong one. The per-column composition itself is asserted by the --paper
  # byte-identity comparison, which this case is what makes non-vacuous, and by
  # tests/test_collectors_new.py; see the README.
  expect:
    R-RES-001: not-applicable
  forbid:
    R-RES-001: pass
    R-RES-002: pass
    R-DRIFT-001: fail

- case: synthetic_coincident_values
  # Same shape as the cases above, and the same caveat: the real assertion is not
  # here. This case's three measurements sharing one value, and the restatement of
  # one of them that must still merge, are decided in the claims package, which no
  # rule reads -- and run_check() below is called without a paper, so the LaTeX
  # collector never runs for it. What this file pins is that a paper the harness
  # cannot read yields no verdict rather than a wrong one. The clustering itself is
  # asserted by the --paper byte-identity comparison, which this case is what makes
  # non-vacuous -- it is the corpus's first multi-member cluster -- and by
  # tests/test_claims_extraction.py; see the README.
  expect:
    R-RES-001: not-applicable
  forbid:
    R-RES-001: pass
    R-RES-002: pass
    R-DRIFT-001: fail

- case: synthetic_metric_vocabulary
  # Same shape as the cases above, and the same caveat stated at
  # synthetic_wrapped_table_header: the real assertion is not here. This case's
  # columns are headed by names only the extended metric vocabulary can read,
  # and canonicalising a header reaches the claims package alone, which no rule
  # reads. What this file pins is that a paper whose cells reach no rule yields
  # no verdict rather than a wrong one. That each name resolves, and that the
  # ROUGE variants and the two correlations stay distinct, is asserted by
  # tests/test_claims_extraction.py; that the corpus can see the vocabulary at
  # all is what this case is for, and is measured by the manifest byte-identity
  # comparison in bench/dev/manifest_identity.py. See the README.
  expect:
    R-RES-001: not-applicable
  forbid:
    R-RES-001: pass
    R-RES-002: pass
    R-DRIFT-001: fail

- case: synthetic_quoted_baseline_rows
  # Same shape as the cases above, and the same caveat, with one difference worth
  # knowing. This case's cited rows and its section headers decide how confidently
  # each cell is read, which only reaches the claims package, which no rule reads
  # -- and run_check() below is called without a paper, so the LaTeX collector
  # never runs for it. What this file pins is that a paper the harness cannot read
  # yields no verdict rather than a wrong one. Unlike the cases above, the --paper
  # byte-identity comparison cannot assert this one either: the default JSON report
  # carries no claim confidence and no resolution method. The demotion is asserted
  # by tests/test_collectors_new.py and tests/test_claims_extraction.py, and is
  # visible in the manifest; see the README.
  expect:
    R-RES-001: not-applicable
  forbid:
    R-RES-001: pass
    R-RES-002: pass
    R-DRIFT-001: fail
- case: synthetic_preamble_definition
  # Unlike the paper-side cases above, this one is asserted here, because its
  # planted faults reach rules rather than only the claims package. The case
  # carries a results file, so the two reconciliation rules that read the paper's
  # prose numbers have something to reconcile against -- and a number read out of
  # a command definition is then not merely a spurious claim but a false
  # contradiction: `iou = 1` and `dice = 1` against a log stating 82.9 and 91.3
  # make R-RES-002 report that the paper materially differs from its own results,
  # R-RES-004 report `auc` and `f1` as unlogged, and the arity of a definition
  # `num_heads` make R-DRIFT-003 report a hyperparameter the paper never states.
  # Five rules move; see the README for the measurement.
  expect:
    R-RES-002: pass
    R-RES-004: pass
    R-DRIFT-001: not-applicable
    R-DRIFT-003: not-applicable
  forbid:
    R-RES-002: partial
    R-RES-004: partial
    R-DRIFT-001: unknown
    R-DRIFT-003: partial

- case: synthetic_metric_cutoff
  # Asserted here for the same reason as the case above: the case carries a
  # results file stating the recall its own sentence states, so reading the `1`
  # of `recall@1` as the recall makes R-RES-002 report that the paper materially
  # differs from its logs, and the `mrr`, `bleu` and `rouge` read out of the
  # remaining cutoffs make R-RES-004 report three unlogged metrics. The claim-side
  # facts -- that both routes to a cutoff are closed and that the number stated
  # after one is still read -- are asserted in tests/test_collectors_new.py, and
  # the corpus byte-identity comparisons see the whole claim set. See the README.
  expect:
    R-RES-002: pass
    R-RES-004: pass
  forbid:
    R-RES-002: partial
    R-RES-004: partial

- case: synthetic_spaced_config_key
  # The config states the decoder depth the paper states, under the key the paper
  # heads its own ablation column with. Resolving a dotted key on an unstripped
  # terminal segment left that key naming nothing, so the paper's depth was
  # reported as having no counterpart in code: R-DRIFT-003 partial about a value
  # the repository holds, and R-DRIFT-001 unknown because no statement could be
  # matched at all. No repository in the dev set writes a key of this shape, so
  # this case is the only place that path is exercised. See the README.
  expect:
    R-DRIFT-001: pass
    R-DRIFT-003: pass
  forbid:
    R-DRIFT-001: unknown
    R-DRIFT-003: partial

- case: synthetic_markup_residue
  # A paper-side case, and what it can and cannot assert here is stated plainly.
  # The markup residue it plants lands in a table cell's row and column labels, and
  # table cells reach only the claims package, which no rule reads, so no verdict
  # moves on it: all 28 findings this case yields are byte-identical against a
  # source tree carrying the residue. That 28 counts findings, not cases. The
  # LaTeX collector does run -- run_check() below finds paper/main.tex inside the
  # case directory -- so the case is read; it is the absence of any rule over
  # drafted claims that keeps the verdicts still. What this file pins is that a
  # paper whose table the parser now reads correctly still yields no verdict about
  # anything it did not measure: the prose accuracy reconciles with the results
  # file and no phantom hyperparameter appears.
  #
  # The residue itself is asserted two ways. tests/test_collectors_new.py pins each
  # planted shape on its own and this fixture's eight cells as a whole, and the two
  # byte-identity comparisons see the whole claim set: without the fixes this case
  # yields six cells instead of eight -- both `\hspace`-wrapped values are dropped,
  # because a cell reading `-0.9em91.4-0.4em` states no number the parser can find
  # -- and every column is named by the wrong header, because the escaped ampersand
  # of `$ (\mathcal{J}$\&$\mathcal{F})_m$` was split as a column separator and left
  # six headers over five columns. Measured at the 27 cases the corpus then held:
  # the manifest harness reports two cases moved and the JSON report four. See the
  # README.
  expect:
    R-RES-002: pass
    R-RES-004: pass
    R-DRIFT-001: not-applicable
    R-DRIFT-003: not-applicable
  forbid:
    R-RES-002: partial
    R-RES-004: partial
    R-DRIFT-003: partial

- case: synthetic_class_file_macro
  # Asserted here, because the planted fault reaches rules. `@` is a letter in a
  # command name wherever `\makeatletter` is in force, which is all of class and
  # style code, so a name class of `[a-zA-Z]+` does not recognise
  # `\def\@fs@pre{\hrule height.8pt depth0pt \kern2pt}` as a definition at all
  # and leaves its body standing in the document, where the prose scan reads
  # `depth0pt` as a layer count. The case carries a results file so the two
  # reconciliation rules have something to reconcile, and the phantom is a
  # hyperparameter, so three rules move: R-DRIFT-003 reports a `num_layers` the
  # paper never states, R-DRIFT-001 reports that hyperparameters were extracted
  # but none could be matched, and R-DRIFT-002 passes on an ambiguity question
  # the paper raises nothing for. All three are not-applicable once the
  # definition is recognised. See the README.
  expect:
    R-RES-002: pass
    R-RES-004: pass
    R-DRIFT-001: not-applicable
    R-DRIFT-002: not-applicable
    R-DRIFT-003: not-applicable
  forbid:
    R-DRIFT-001: unknown
    R-DRIFT-002: pass
    R-DRIFT-003: partial

- case: synthetic_counter_assignment
  # Asserted here for the same reason and through the same three rules as the case
  # above, and kept separate from it deliberately: both faults surface as a
  # phantom `num_layers`, so one case carrying both could not tell a regression of
  # one from a regression of the other.
  #
  # A counter is not a measurement. Setting one puts a keyword and a number two
  # characters apart -- `\setcounter{tocdepth}{2}` reads as `depth}{2` -- and this
  # is a *use* of a command rather than a definition of one, so removing definitions
  # cannot reach it. Three assignments here each yield a phantom:
  # `\setcounter{tocdepth}{2}` and `\addtocounter{secnumdepth}{1}` give `num_layers`
  # 2 and 1, and `\setlength{\headsep}{4pt}` gives `num_heads` 4, so the most common
  # member of the family is load-bearing here rather than decorative.
  # `\setlength{\tabcolsep}{6pt}` is the control: an assignment naming no
  # hyperparameter, which must keep naming none. Per-command coverage of all eight
  # commands the guard removes is in tests/test_collectors_new.py, which asserts its
  # probe set equals the covered set. See the README.
  expect:
    R-RES-002: pass
    R-RES-004: pass
    R-DRIFT-001: not-applicable
    R-DRIFT-002: not-applicable
    R-DRIFT-003: not-applicable
  forbid:
    R-DRIFT-001: unknown
    R-DRIFT-002: pass
    R-DRIFT-003: partial

- case: synthetic_reference_row_label
  # A paper-side case of the same family as synthetic_markup_residue, and what it
  # can and cannot assert here is stated just as plainly. The residue it plants
  # lands in a table cell's row and column labels, and table cells reach only the
  # claims package, which no rule reads, so no verdict moves on it. That was
  # measured rather than assumed -- all 28 findings this case yields are
  # byte-identical against a source tree carrying the residue, as are
  # synthetic_markup_residue's. That 28 counts findings, not cases. The LaTeX
  # collector does run (run_check() finds paper/main.tex inside the case
  # directory), so the case is read; it is the
  # absence of any rule over drafted claims that keeps the verdicts still. What
  # this file pins is that a paper whose table the parser now reads correctly still
  # yields no verdict about anything it did not measure: the prose accuracy
  # reconciles with the results file and no phantom hyperparameter appears.
  #
  # The residue itself is asserted two ways. tests/test_collectors_new.py pins each
  # planted shape on its own, both controls, and this fixture's eight cells as a
  # whole; and both byte-identity instruments see this case and no other -- the
  # manifest harness reports it moved on `column_label`, `row_label` and `text` on
  # 8 of 8 claims, and the JSON report reports it too. Without the fixes the same
  # eight cells read `tab:baseline` and `0.3 tab:scaling` for their rows and
  # `1.0pt (a) Ablations restated 7.5pt1em Accuracy` for their columns. The last two
  # rows of the table are the controls on the row-label search: a numeric label that
  # must survive it, and a row whose values start immediately, which must stay
  # unnamed rather than be named after one of its own measurements. See the README.
  expect:
    R-RES-002: pass
    R-RES-004: pass
    R-DRIFT-001: not-applicable
    R-DRIFT-003: not-applicable
  forbid:
    R-RES-002: partial
    R-RES-004: partial
    R-DRIFT-003: partial

- case: synthetic_macro_wrapped_float
  # Asserted here, unusually for a paper-side case, because this one bites in both
  # directions on one rule. The paper wraps a whole `table` float in a command and
  # invokes it in the body, and it also defines DETR's `\iouloss`, which is only a
  # name. `results/eval.csv` states the IoU and Dice the float's caption states, so
  # the reconciliation rules have something to reconcile against. Remove the
  # environment-bearing definition and the paper states nothing: R-RES-002 reads
  # `unknown` and R-RES-004 `not-applicable`, which is measured, and is the state
  # that took latent-diffusion from 624 table cells to 0 and stylegan2-ada from 66
  # to 0. Remove no definition and `\iouloss` is read as an IoU of 1, so R-RES-002
  # reads `partial` against a logged 82.9 -- the paper accused of contradicting its
  # own results on a number it never prints. The four cells themselves reach only
  # the claims package, which no rule reads, so they are asserted in
  # tests/test_collectors_new.py; see the README.
  expect:
    R-RES-002: pass
    R-RES-004: pass
  forbid:
    R-RES-002: unknown
    R-RES-004: not-applicable
