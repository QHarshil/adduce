name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Validate and build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install validation tools
        # Constrained, not resolved: see release-constraints.txt. The gates below
        # must answer the same way they answered in CI on this exact commit.
        run: python -m pip install -c release-constraints.txt ".[dev,release]"
      - name: Validate annotated release tag and metadata
        shell: bash
        run: |
          set -euo pipefail
          # actions/checkout resolves the pushed ref and re-fetches it as
          # "+<sha>:refs/tags/<tag>", which replaces the annotated tag object
          # with a ref pointing straight at the commit. Restore the tag object
          # before inspecting its type, or the check below can never pass.
          git fetch --force --no-recurse-submodules origin \
            "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          tag_object_type="$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")"
          if [ "$tag_object_type" != "tag" ]; then
            echo "release tag ${GITHUB_REF_NAME} is a ${tag_object_type}," \
              "not an annotated tag" >&2
            exit 1
          fi
          tag_commit="$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{commit}")"
          if ! git merge-base --is-ancestor \
            "${tag_commit}" refs/remotes/origin/main; then
            echo "release tag ${GITHUB_REF_NAME} commit ${tag_commit} is not" \
              "an ancestor of origin/main" >&2
            exit 1
          fi
          python scripts/validate_release.py --tag "${GITHUB_REF_NAME}"
      - name: Run release quality gates
        run: |
          ruff check src tests scripts corpus/scripts bench
          mypy src/adduce scripts corpus/scripts bench
          pytest \
            --cov=adduce \
            --cov-report=term-missing \
            --cov-fail-under=85
          python scripts/check_markdown_links.py --root .
          python -B corpus/scripts/check_review_materials.py check --root .
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate and smoke-test distributions
        run: |
          twine check --strict dist/*
          bash scripts/smoke_install.sh dist/*.whl
          bash scripts/smoke_install.sh dist/*.tar.gz
      # Release metadata is immutable per version, so a link that dangles only
      # inside the archive cannot be corrected after publication.
      - name: Check local Markdown links inside the extracted source distribution
        run: |
          mkdir -p "${RUNNER_TEMP}/sdist"
          tar -xzf dist/*.tar.gz -C "${RUNNER_TEMP}/sdist"
          extracted="$(find "${RUNNER_TEMP}/sdist" -mindepth 1 -maxdepth 1 -type d)"
          python scripts/check_markdown_links.py --root "${extracted}"
      - name: Retain validated distributions for the publish job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to PyPI with OIDC
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/adduce/
    permissions:
      id-token: write
    steps:
      - name: Retrieve validated distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-distributions
          path: dist/
      - name: Publish package distributions
        # v1.14.2, not v1.14.1: the action runs its own twine before uploading,
        # and 1.14.1 bundles a twine that rejects core metadata 2.5 — which is
        # what hatchling writes. The v0.2.0 publish failed there, after every
        # gate had passed, with "'2.5' is not a valid metadata version".
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
