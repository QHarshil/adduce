name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Validate and build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install validation tools
        run: python -m pip install ".[dev,release]"
      - name: Validate annotated release tag and metadata
        shell: bash
        run: |
          set -euo pipefail
          test "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" = "tag"
          git merge-base --is-ancestor \
            "$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{commit}")" \
            refs/remotes/origin/main
          python scripts/validate_release.py --tag "${GITHUB_REF_NAME}"
      - name: Run release quality gates
        run: |
          ruff check src tests scripts corpus/scripts
          mypy src/adduce scripts corpus/scripts
          pytest \
            --cov=adduce \
            --cov-report=term-missing \
            --cov-fail-under=85
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate and smoke-test distributions
        run: |
          twine check --strict dist/*
          bash scripts/smoke_install.sh dist/*.whl
          bash scripts/smoke_install.sh dist/*.tar.gz
      - name: Retain validated distributions for the publish job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to PyPI with OIDC
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/adduce/
    permissions:
      id-token: write
    steps:
      - name: Retrieve validated distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-distributions
          path: dist/
      - name: Publish package distributions
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
