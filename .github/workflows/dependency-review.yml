name: dependency review

# Refuses a pull request that introduces a dependency with a known advisory, at
# the point the dependency is proposed rather than after it is installed.
# Dependabot reports what is already here; this reports what is arriving.
on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          # The licence allowlist is deliberately absent: this project takes
          # dependencies under several permissive licences and an allowlist that
          # is wrong fails honest pull requests.
          comment-summary-in-pr: on-failure
