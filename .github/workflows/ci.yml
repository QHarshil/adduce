name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

# Only pull-request runs are cancelled when superseded. Pushes to main and dev
# and the weekly schedule run to completion, because their results are read
# after the fact rather than watched.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality:
    name: Quality (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          cache: pip
          cache-dependency-path: pyproject.toml
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests scripts corpus/scripts bench
      - name: Type check
        run: mypy src/adduce scripts corpus/scripts bench
      - name: Test with coverage gate
        run: >-
          pytest
          --cov=adduce
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --cov-fail-under=85
      - name: Check local Markdown links
        run: python scripts/check_markdown_links.py --root .
      - name: Check reviewer material for coordinator-only content
        run: python -B corpus/scripts/check_review_materials.py check --root .

  compatibility:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          cache: pip
          cache-dependency-path: pyproject.toml
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: pytest

  package:
    name: Package validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          cache: pip
          cache-dependency-path: pyproject.toml
          python-version: "3.12"
      - name: Install package validation tools
        run: python -m pip install ".[release]"
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate distribution metadata
        run: twine check --strict dist/*
      - name: Install distributions in clean environments and smoke-test packaged data
        run: |
          bash scripts/smoke_install.sh dist/*.whl
          bash scripts/smoke_install.sh dist/*.tar.gz
      # A relative link can resolve in the repository and dangle in the archive,
      # so the extracted tree is checked separately from the checkout.
      - name: Check local Markdown links inside the extracted source distribution
        run: |
          mkdir -p "${RUNNER_TEMP}/sdist"
          tar -xzf dist/*.tar.gz -C "${RUNNER_TEMP}/sdist"
          extracted="$(find "${RUNNER_TEMP}/sdist" -mindepth 1 -maxdepth 1 -type d)"
          python scripts/check_markdown_links.py --root "${extracted}"

  action-integration:
    name: Composite Action integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          cache: pip
          cache-dependency-path: pyproject.toml
          python-version: "3.12"
      - name: Install the current source package
        run: python -m pip install -e .
      - name: Prepare an Action fixture with a repository threshold
        run: |
          mkdir -p "${{ runner.temp }}/adduce-action-fixture"
          cp -R corpus/synthetic/synthetic_lr_agreement/. "${{ runner.temp }}/adduce-action-fixture/"
          printf 'fail-under = 100\n' > "${{ runner.temp }}/adduce-action-fixture/adduce.toml"
      - name: Exercise the checked-out composite Action
        id: audit
        uses: ./
        with:
          path: ${{ runner.temp }}/adduce-action-fixture
          version: ""
          sarif-file: ${{ runner.temp }}/adduce-action.sarif
          report-file: ${{ runner.temp }}/adduce-action.md
      - name: Validate Action outputs
        env:
          ADDUCE_ACTION_SCORE: ${{ steps.audit.outputs.score }}
        run: |
          python -c "import os; score = float(os.environ['ADDUCE_ACTION_SCORE']); assert 0 <= score < 100"
          python -c "import json; data = json.load(open('${{ runner.temp }}/adduce-action.sarif')); assert data['version'] == '2.1.0'"
          test -s "${{ runner.temp }}/adduce-action.md"
      - name: Exercise a failing score gate
        id: failing-audit
        continue-on-error: true
        uses: ./
        with:
          path: ${{ runner.temp }}/adduce-action-fixture
          version: ""
          fail-under: "100"
          sarif-file: ${{ runner.temp }}/adduce-action-failing.sarif
          report-file: ${{ runner.temp }}/adduce-action-failing.md
      - name: Validate failure status and retained reports
        env:
          ADDUCE_ACTION_OUTCOME: ${{ steps.failing-audit.outcome }}
        run: |
          test "$ADDUCE_ACTION_OUTCOME" = "failure"
          python -c "import json; data = json.load(open('${{ runner.temp }}/adduce-action-failing.sarif')); assert data['version'] == '2.1.0'"
          test -s "${{ runner.temp }}/adduce-action-failing.md"

  benchmark:
    name: Benchmark regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          cache: pip
          cache-dependency-path: pyproject.toml
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      # Clone targets live under a gitignored tree that ships in no archive, so
      # they report unavailable here and the synthetic targets carry the gate.
      - name: Measure
        run: python bench/runner.py measure --output "${RUNNER_TEMP}/bench.json"
      - name: Compare against the committed baseline
        run: >-
          python bench/runner.py compare
          --baseline bench/reports/baseline.json
          --current "${RUNNER_TEMP}/bench.json"

  self-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          cache: pip
          cache-dependency-path: pyproject.toml
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Run adduce on itself
        run: adduce check . --verbose

  lowest-direct:
    # The compatibility matrix installs whatever the resolver picks, which is
    # the newest release of everything, so it tests the ceiling and never the
    # floor. This installs the oldest combination pyproject.toml claims to
    # support. It runs on the lowest supported Python because that is where the
    # floor's wheels exist; the floors predate the newest interpreters.
    name: Lowest direct dependencies (Python 3.10)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          cache: pip
          cache-dependency-path: pyproject.toml
          python-version: "3.10"
      # Derived from pyproject rather than committed separately, so raising a
      # floor cannot leave a stale pin behind. A dependency with no lower bound
      # fails the step instead of being dropped from the constraints.
      # Bootstrap only. This job runs on 3.10, which has no stdlib tomllib, and
      # the constraints have to exist before the project is installed, so the
      # parser cannot come from the project's own dependencies. The constrained
      # install below pins tomli back down to its declared floor.
      - name: Install a TOML parser for the constraints step
        run: python -m pip install tomli
      - name: Pin every direct dependency to its declared floor
        run: |
          python scripts/lowest_direct_constraints.py --output "${RUNNER_TEMP}/lowest-direct.txt"
          cat "${RUNNER_TEMP}/lowest-direct.txt"
      - name: Install at the floor
        run: python -m pip install -c "${RUNNER_TEMP}/lowest-direct.txt" -e ".[dev]"
      - name: Record what actually resolved
        run: python -m pip list
      - name: Test
        run: pytest

  external-plugin-contract:
    # Installs the fixture as a real distribution so importlib.metadata finds it
    # the way it finds any third-party pack. This exercises the published
    # extension surface rather than a simulated one: nothing here monkeypatches
    # entry points or constructs an EntryPoint by hand.
    #
    # ADDUCE_REQUIRE_EXTERNAL_PLUGIN turns "plugin not installed" from a skip
    # into a failure. Without it a broken install step would leave this job green
    # over five tests that never ran.
    #
    # Only the contract file runs. The fixture deliberately registers a reporter
    # named `json` to prove a built-in format cannot be shadowed, so every import
    # of adduce.report in this environment warns; running the whole suite here
    # would measure that instead of the contract.
    name: External plugin contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          cache: pip
          cache-dependency-path: pyproject.toml
          python-version: "3.12"
      # Not an editable install: the point is to audit what an installed
      # distribution exposes, not what the working tree happens to contain.
      - name: Install adduce and the external contract plugin
        run: |
          python -m pip install ".[dev]"
          python -m pip install tests/fixtures/external_plugin
      - name: Confirm both entry-point groups are registered
        run: |
          python -c "
          from importlib.metadata import entry_points
          groups = {g: sorted(e.name for e in entry_points(group=g))
                    for g in ('adduce.rules', 'adduce.reporters')}
          print(groups)
          assert 'contract-plugin' in groups['adduce.rules']
          assert 'contract-plugin' in groups['adduce.reporters']
          "
      - name: Contract test
        env:
          ADDUCE_REQUIRE_EXTERNAL_PLUGIN: "1"
        run: pytest tests/contract/test_external_plugin_contract.py -o addopts="" -v

  pypi-smoke:
    # Verifies the published package (data files, templates, entry points),
    # not the checkout. Runs on demand and on a weekly schedule.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          cache: pip
          cache-dependency-path: pyproject.toml
          python-version: "3.12"
      - name: Smoke-test the PyPI release
        run: bash scripts/smoke_install.sh

  ci-ok:
    # The one check to mark required on a pull request. It deliberately does not
    # depend on pypi-smoke: that job is dispatch- and schedule-only and skips on
    # every pull request, so requiring it would block every merge.
    #
    # `if: always()` is what makes this meaningful — without it the job would be
    # skipped when a dependency failed, and a skipped required check reads as
    # "not failed" on the branch protection UI.
    name: CI
    if: always()
    needs:
      - quality
      - compatibility
      - package
      - action-integration
      - benchmark
      - self-check
      - lowest-direct
      - external-plugin-contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every required job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          for name, data in sorted(needs.items()):
              print(f"{data['result']:>9}  {name}")
          failed = sorted(n for n, d in needs.items() if d["result"] != "success")
          if failed:
              print("\nrequired jobs that did not succeed: " + ", ".join(failed))
              sys.exit(1)
          print("\nall required jobs succeeded")
          PY
