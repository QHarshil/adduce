name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  quality:
    name: Quality (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests scripts corpus/scripts
      - name: Type check
        run: mypy src/adduce scripts corpus/scripts
      - name: Test with coverage gate
        run: >-
          pytest
          --cov=adduce
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --cov-fail-under=85
      - name: Check local Markdown links
        run: python scripts/check_markdown_links.py --root .

  compatibility:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: pytest

  package:
    name: Package validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install package validation tools
        run: python -m pip install ".[release]"
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate distribution metadata
        run: twine check --strict dist/*
      - name: Install distributions in clean environments and smoke-test packaged data
        run: |
          bash scripts/smoke_install.sh dist/*.whl
          bash scripts/smoke_install.sh dist/*.tar.gz
      # A relative link can resolve in the repository and dangle in the archive,
      # so the extracted tree is checked separately from the checkout.
      - name: Check local Markdown links inside the extracted source distribution
        run: |
          mkdir -p "${RUNNER_TEMP}/sdist"
          tar -xzf dist/*.tar.gz -C "${RUNNER_TEMP}/sdist"
          extracted="$(find "${RUNNER_TEMP}/sdist" -mindepth 1 -maxdepth 1 -type d)"
          python scripts/check_markdown_links.py --root "${extracted}"

  action-integration:
    name: Composite Action integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install the current source package
        run: python -m pip install -e .
      - name: Prepare an Action fixture with a repository threshold
        run: |
          mkdir -p "${{ runner.temp }}/adduce-action-fixture"
          cp -R corpus/synthetic/synthetic_lr_agreement/. "${{ runner.temp }}/adduce-action-fixture/"
          printf 'fail-under = 100\n' > "${{ runner.temp }}/adduce-action-fixture/adduce.toml"
      - name: Exercise the checked-out composite Action
        id: audit
        uses: ./
        with:
          path: ${{ runner.temp }}/adduce-action-fixture
          version: ""
          sarif-file: ${{ runner.temp }}/adduce-action.sarif
          report-file: ${{ runner.temp }}/adduce-action.md
      - name: Validate Action outputs
        env:
          ADDUCE_ACTION_SCORE: ${{ steps.audit.outputs.score }}
        run: |
          python -c "import os; score = float(os.environ['ADDUCE_ACTION_SCORE']); assert 0 <= score < 100"
          python -c "import json; data = json.load(open('${{ runner.temp }}/adduce-action.sarif')); assert data['version'] == '2.1.0'"
          test -s "${{ runner.temp }}/adduce-action.md"
      - name: Exercise a failing score gate
        id: failing-audit
        continue-on-error: true
        uses: ./
        with:
          path: ${{ runner.temp }}/adduce-action-fixture
          version: ""
          fail-under: "100"
          sarif-file: ${{ runner.temp }}/adduce-action-failing.sarif
          report-file: ${{ runner.temp }}/adduce-action-failing.md
      - name: Validate failure status and retained reports
        env:
          ADDUCE_ACTION_OUTCOME: ${{ steps.failing-audit.outcome }}
        run: |
          test "$ADDUCE_ACTION_OUTCOME" = "failure"
          python -c "import json; data = json.load(open('${{ runner.temp }}/adduce-action-failing.sarif')); assert data['version'] == '2.1.0'"
          test -s "${{ runner.temp }}/adduce-action-failing.md"

  self-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Run adduce on itself
        run: adduce check . --verbose

  pypi-smoke:
    # Verifies the published package (data files, templates, entry points),
    # not the checkout. Runs on demand and on a weekly schedule.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Smoke-test the PyPI release
        run: bash scripts/smoke_install.sh
